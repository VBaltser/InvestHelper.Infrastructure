---
- name: Create cAdvisor directory
  ansible.builtin.file:
    path: /opt/cadvisor
    state: directory
    mode: "0755"

- name: Install cAdvisor Compose definition
  ansible.builtin.copy:
    dest: /opt/cadvisor/compose.yml
    mode: "0644"
    content: |
      services:
        cadvisor:
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          restart: unless-stopped
          privileged: true
          ports:
            - "8081:8080"
          volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker:/var/lib/docker:ro
            - /dev/disk:/dev/disk:ro

- name: Start cAdvisor
  ansible.builtin.command: docker compose -f /opt/cadvisor/compose.yml up -d
  register: cadvisor_compose
  changed_when: "'Started' in cadvisor_compose.stdout or 'Created' in cadvisor_compose.stdout"
