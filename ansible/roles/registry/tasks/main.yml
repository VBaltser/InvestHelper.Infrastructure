---
- name: Create registry directory
  ansible.builtin.file:
    path: /opt/registry
    state: directory
    mode: "0755"

- name: Install registry Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/registry/compose.yml
    mode: "0644"

- name: Start local registry
  ansible.builtin.command: docker compose -f /opt/registry/compose.yml up -d
  register: registry_compose
  changed_when: "'Started' in registry_compose.stdout or 'Created' in registry_compose.stdout"
