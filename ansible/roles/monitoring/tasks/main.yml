---
- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring/prometheus
    - /opt/monitoring/alertmanager
    - /opt/monitoring/grafana/provisioning/datasources

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus/prometheus.yml
    mode: "0644"
  notify: Recreate Prometheus to load configuration

- name: Install Prometheus alert rules
  ansible.builtin.copy:
    src: alerts.yml
    dest: /opt/monitoring/prometheus/alerts.yml
    mode: "0644"
  notify: Recreate Prometheus to load configuration

- name: Check Telegram configuration is complete
  ansible.builtin.assert:
    that:
      - (telegram_bot_token | default('') | length > 0) == (telegram_chat_id | default('') | string | length > 0)
      - telegram_chat_id | default('0') | string is match('^-?[0-9]+$')
  no_log: true
  tags: [alertmanager]

- name: Inspect existing Alertmanager configuration
  ansible.builtin.stat:
    path: /opt/monitoring/alertmanager/alertmanager.yml
  register: alertmanager_config
  tags: [alertmanager]

- name: Install fallback Alertmanager configuration only on unconfigured systems
  ansible.builtin.copy:
    src: alertmanager.yml
    dest: /opt/monitoring/alertmanager/alertmanager.yml
    mode: "0644"
  when:
    - not alertmanager_config.stat.exists
    - telegram_bot_token | default('') | length == 0
  notify: Recreate Alertmanager to load configuration
  tags: [alertmanager]

- name: Configure Alertmanager Telegram receiver
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /opt/monitoring/alertmanager/alertmanager.yml
    owner: root
    group: "65534"
    mode: "0640"
    validate: 'docker run --rm --network none --user 0 --entrypoint /bin/amtool -v %s:/etc/alertmanager/alertmanager.yml:ro prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml'
  when: telegram_bot_token | default('') | length > 0
  no_log: true
  notify: Recreate Alertmanager to load configuration
  tags: [alertmanager]

- name: Provision Grafana datasource
  ansible.builtin.copy:
    src: datasource.yml
    dest: /opt/monitoring/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"

- name: Install monitoring Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/monitoring/compose.yml
    mode: "0644"

- name: Start monitoring stack
  ansible.builtin.command: docker compose -f /opt/monitoring/compose.yml up -d
  register: monitoring_compose
  changed_when: "'Started' in monitoring_compose.stdout or 'Created' in monitoring_compose.stdout"
