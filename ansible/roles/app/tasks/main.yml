---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/investhelper
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0750"

- name: Install runtime Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/investhelper/compose.yml
    owner: vagrant
    group: vagrant
    mode: "0640"

- name: Install application environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/investhelper/.env
    owner: vagrant
    group: vagrant
    mode: "0600"
  no_log: true

- name: Install deployment helper
  ansible.builtin.template:
    src: deploy.sh.j2
    dest: /usr/local/bin/deploy-investhelper
    mode: "0755"
