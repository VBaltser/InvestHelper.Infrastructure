---
- name: Configure baseline on every VM
  hosts: all
  become: true
  pre_tasks:
    - name: Prepare Ansible temporary directory for privilege escalation
      ansible.builtin.raw: install -d -m 0700 /root/.ansible/tmp
      changed_when: false
  roles:
    - common
    - node_exporter

- name: Configure CI, Jenkins and local registry
  hosts: ci_nodes
  become: true
  roles:
    - docker
    - cadvisor
    - registry
    - jenkins

- name: Configure application runtime
  hosts: app_nodes
  become: true
  roles:
    - docker
    - cadvisor
    - app

- name: Configure monitoring stack
  hosts: monitoring_nodes
  become: true
  roles:
    - docker
    - cadvisor
    - monitoring
